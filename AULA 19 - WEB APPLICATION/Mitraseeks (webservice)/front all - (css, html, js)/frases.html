<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sem sessão, vai para a criação de conta/login -->
    <script>try { if (!localStorage.getItem('mitraseeks.token')) location.replace('login.html'); } catch (e) { }</script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/detalhes.css">
    <link rel="stylesheet" href="css/frases.css">

    <title>MITRASEEKS - Frases clássicas</title>
</head>

<body>
    <main class="ficha">
        <a class="frase-voltar" href="index.html">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Voltar para o início
        </a>
        <div class="ficha-descricao" id="ficha-descricao" aria-live="polite">
            <!-- A frase sorteada será inserida aqui -->
        </div>
        <button type="button" class="botao frase-sortear" data-sortear>Ver outra frase</button>
    </main>

    <script src="./scripts/frases.js" type="module"></script>
</body>

</html>
