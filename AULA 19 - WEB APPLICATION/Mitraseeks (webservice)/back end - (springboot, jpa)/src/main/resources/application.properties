spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Rotas inexistentes viram NoHandlerFoundException (tratada no TratadorDeErros) em vez da página padrão
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Email dos códigos de confirmação/redefinição (EmailService), lido do .env:
#   MAIL_HOST=smtp.gmail.com  MAIL_PORT=587  MAIL_USERNAME=voce@gmail.com  MAIL_PASSWORD=<senha de app>  MAIL_FROM=(opcional)
# Sem MAIL_HOST, o código só aparece no console do back (modo dev).

# Conta de admin (AdminInicializador), criada/atualizada a cada start, sem cadastro, lida do .env:
#   ADMIN_USUARIO=admin  ADMIN_EMAIL=admin@mitraseeks.local  ADMIN_SENHA=<senha>
# Sem ADMIN_SENHA, uma senha temporária é gerada e mostrada no console do back.

# O front é servido pelo próprio back (FrontConfiguration): abra http://localhost:8080
#   FRONT_DIR=../front all - (css, html, js)   (padrão; relativo à pasta do back)
# Origens liberadas no CORS para chamar a API de outro domínio (ex.: Live Server, Vercel):
#   CORS_ORIGINS=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501
