<canvas width = "600" height = "400"></canvas>

<script>
    var tela = document.querySelector('canvas');
    var pincel = tela.getContext('2d');

    //implementa o quadro cinza com as dimensoes dadas
    pincel.fillStyle = 'lightgrey';
    pincel.fillRect(0,0,600,400);

    //FUNCAO  DO CIRCULO COM AS MEDIDAS 
    function desenhaCirculo(x, y, raio) {
        pincel.fillStyle = 'blue';
        pincel.beginPath();
        pincel.arc(x, y, raio, 0, 2* Math.PI);
        pincel.fill();
}
    //OUTRA FUNCAO QUE LIMPA OS CIRCULOS 
    function limpaTela() {
        pincel.clearRect(0, 0, 600, 400);
    }
    //VALORES DINAMICOS
    var x = 20;
    var sentido = 1
    
    //SUBSTITUINDO A BOLINHA PELA PROXIMA (IDA E VOLTA)
    function atualizaTela() {
        limpaTela();
        if (x > 600) {sentido = -1;}
        desenhaCirculo(x, 20, 10);
        x = x + sentido;
        
    }
    //o 'setInterval' chama diversas vezes a funcao, acom o parametro de qts em qts segundos 
    setInterval(atualizaTela, 1);

</script>
